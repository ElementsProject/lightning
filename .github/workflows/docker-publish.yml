name: Docker publish

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      dh-repository-owner:
        type: string
        required: true
      push-latest:
        type: string
        required: true
      # JSON array; see docker-build.yml.
      variants:
        type: string
        default: '["lightningd", "lightningd-vls-signer"]'

jobs:
  publish:
    name: Tag and publish ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(inputs.variants) }}
    steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Download platform digests for this target
      uses: actions/download-artifact@v8
      with:
        pattern: digest_${{ matrix.variant }}_*
        path: /tmp/digests
        merge-multiple: false

    - name: Set up values
      env:
        DH_REPOSITORY_OWNER: ${{ inputs.dh-repository-owner }}
        PUSH_LATEST: ${{ inputs.push-latest }}
        VERSION: ${{ inputs.version }}
        VARIANT: ${{ matrix.variant }}
      run: |
        case "$VARIANT" in
          lightningd)            TAG_SUFFIX="";;
          lightningd-vls-signer) TAG_SUFFIX="-vls";;
          lightningd-signed)     TAG_SUFFIX="-signed";;
          *) echo "unknown variant $VARIANT" >&2; exit 1;;
        esac
        echo "TAG_SUFFIX=$TAG_SUFFIX" >> $GITHUB_ENV

        DIGEST_REFS=""
        for f in /tmp/digests/*/digest.txt; do
          D=$(cat "$f")
          DIGEST_REFS="$DIGEST_REFS ${DH_REPOSITORY_OWNER}/lightningd@${D}"
        done
        echo "DIGEST_REFS=$DIGEST_REFS" >> $GITHUB_ENV

        if [[ "$PUSH_LATEST" == "true" ]]; then
          echo "PUSHLATEST=true" >> $GITHUB_ENV
        else
          echo "PUSHLATEST=false" >> $GITHUB_ENV
        fi

    - name: Create and push real tag(s)
      env:
        DH_REPOSITORY_OWNER: ${{ inputs.dh-repository-owner }}
        VERSION: ${{ inputs.version }}
      run: |
        TAG_ARGS=(-t "${DH_REPOSITORY_OWNER}/lightningd:${VERSION}${TAG_SUFFIX}")
        if [[ "$PUSHLATEST" == "true" ]]; then
          TAG_ARGS+=(-t "${DH_REPOSITORY_OWNER}/lightningd:latest${TAG_SUFFIX}")
        fi
        docker buildx imagetools create "${TAG_ARGS[@]}" $DIGEST_REFS

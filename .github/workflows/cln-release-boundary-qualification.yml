name: CLN release boundary qualification (dummy only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout candidate branch without credentials
        uses: actions/checkout@v4
        with:
          ref: ci-release-authority-boundary-20261025
          fetch-depth: 0
          persist-credentials: false
      - name: Validate actual GitHub workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10 -shellcheck= \
            .github/workflows/release.yml \
            .github/workflows/check-release-tag.yml \
            .github/workflows/docker-build.yml \
            .github/workflows/docker-publish.yml \
            .github/workflows/pypi-publish.yml \
            .github/workflows/release-publish.yml \
            .github/workflows/crate-io.yml
      - name: Verify release authority invariants against exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows')
          main=(wf/'release.yml').read_text()
          assert 'secrets: inherit' not in main, 'all-secrets delegation still present'
          assert "if: github.repository == 'ElementsProject/lightning' && github.ref_type == 'tag'" in main
          assert main.count("if: github.repository == 'ElementsProject/lightning' && github.ref_type == 'tag'") == 5
          assert '  release-build:\n' in main
          assert '  pypi-build:\n' in main
          expected={
              'docker-build.yml':('environment: release-docker','Build single-platform image, push by digest'),
              'docker-publish.yml':('environment: release-docker','Create and push real tag(s)'),
              'pypi-publish.yml':('environment: release-pypi','Publish distribution'),
              'release-publish.yml':('environment: release-signing','Import GPG keys'),
          }
          for filename,(env,critical_step) in expected.items():
              text=(wf/filename).read_text()
              assert env in text, filename
              assert critical_step in text, filename
              assert "github.ref_type == 'tag'" in text, filename
              assert 'inputs.version == github.ref_name' in text, filename
          cargo=(wf/'crate-io.yml').read_text()
          assert 'environment: release-cargo' in cargo
          assert "github.ref == 'refs/heads/master'" in cargo
          assert 'CARGO_REGISTRY_TOKEN' in cargo
          check=(wf/'check-release-tag.yml').read_text()
          assert 'skip_validation is not allowed for a tagged release' in check
          docs=Path('.github/RELEASE_AUTHORITY.md').read_text()
          for gate in ['prevent self-review','Remove the repository/organization-level copies','restrict creation','release-docker','release-cargo']:
              assert gate.lower() in docs.lower(), gate
          print('PASS: tagged-only secret-bearing jobs, early Docker digest gate, scoped environments, no inherit, manual unsigned builds, tag bypass rejection, required settings')
          PY
      - name: Prove fork branch cannot enter official tagged publication context
        if: github.repository == 'ElementsProject/lightning' && github.ref_type == 'tag'
        run: exit 99
      - name: Confirm unsigned fork test completed
        run: |
          echo 'PASS: test workflow has no publication secrets or external release actions'

---
# https://docs.corelightning.org/docs/release-checklist
name: "Release 🚀"
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+[0-9a-z]+'
      - 'v[0-9]+.[0-9]+.[0-9]+[0-9a-z]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
      skip_validation:
        description: Skip release validation for untagged commit testing
        default: false
        type: boolean
      create_release:
        description: Create a draft release
        default: false
        type: boolean
      dist-location:
        description: 'PyPI distribution location'
        type: choice
        options:
          - test
          - prod
        default: 'test'

jobs:
  check-version:
    name: Verify release tag
    uses: ./.github/workflows/check-release-tag.yml
    with:
      version: ${{ github.event.inputs.version }}
      skip_validation: ${{ github.event.inputs.skip_validation == 'true' }}


  pypi-build:
    name: PyPI build
    needs: check-version
    uses: ./.github/workflows/pypi-build.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit

  release-build:
    name: Release binaries build
    needs: check-version
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
      skip_validation: ${{ github.event.inputs.skip_validation == 'true' }}
    secrets: inherit

  gate:
    name: All builds succeeded
    needs: [pypi-build, release-build]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "All build paths succeeded — proceeding to publish."

  pypi-publish:
    name: PyPI publish
    needs: [check-version, gate]
    uses: ./.github/workflows/pypi-publish.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
      dist-location: ${{ github.event.inputs.dist-location }}
    secrets: inherit

  release-publish:
    name: Release sign + draft
    needs: [check-version, gate]
    uses: ./.github/workflows/release-publish.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
      create_release: ${{ github.event.inputs.create_release == 'true' }}
    secrets: inherit

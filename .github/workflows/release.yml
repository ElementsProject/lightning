---
# https://docs.corelightning.org/docs/release-checklist
#
# The release *binaries* are no longer built or signed here: they are produced
# and signed locally by `tools/reprobuild`, from one static build per
# architecture, and published from the release captain's machine.  The jobs that
# built the old per-distribution tarballs, drafted the release and signed it
# with the project key are gone with the scripts they called.
#
# The Docker images are gone from here too.  They are built locally by
# `tools/reprobuild docker` -- a Dockerfile over the digest-pinned
# debian:trixie-slim, consuming the static tarball that was just signed, so the
# image compiles nothing -- and pushed by `tools/reprobuild publish` with
# `skopeo copy --all --preserve-digests`, which is what makes the digests users
# pull the digests the release manifests signed.  `latest` is a deliberate
# `--latest` flag, never applied automatically and never to an rc.
#
# What is left here is the tag check and PyPI.
name: "Release 🚀"
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+[0-9a-z]+'
      - 'v[0-9]+.[0-9]+.[0-9]+[0-9a-z]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
      skip_validation:
        description: Skip release validation for untagged commit testing
        default: false
        type: boolean
      dist-location:
        description: 'PyPI distribution location'
        type: choice
        options:
          - test
          - prod
        default: 'test'

jobs:
  check-version:
    name: Verify release tag
    uses: ./.github/workflows/check-release-tag.yml
    with:
      version: ${{ github.event.inputs.version }}
      skip_validation: ${{ github.event.inputs.skip_validation == 'true' }}


  pypi-build:
    name: PyPI build
    needs: check-version
    uses: ./.github/workflows/pypi-build.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
    secrets: inherit

  pypi-publish:
    name: PyPI publish
    needs: [check-version, pypi-build]
    uses: ./.github/workflows/pypi-publish.yml
    with:
      version: ${{ needs.check-version.outputs.version }}
      dist-location: ${{ github.event.inputs.dist-location }}
    secrets: inherit


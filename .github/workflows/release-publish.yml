name: Release publish

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      create_release:
        type: boolean
        required: true

jobs:
  release:
    name: Sign and prepare release draft
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: c-lightning-${{ inputs.version }}
          path: release/

      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: c-lightning-${{ inputs.version }}-arm64
          path: release-arm64/

      - name: Download armv7 artifact
        uses: actions/download-artifact@v8
        with:
          name: c-lightning-${{ inputs.version }}-armv7
          path: release-armv7/

      - name: Import GPG keys
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          trust_level: 5

      - name: Set default GPG key
        env:
          GPG_KEYID: ${{ steps.gpg.outputs.keyid }}
        run: echo "default-key $GPG_KEYID" >> ~/.gnupg/gpg.conf

      - name: Sign release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tools/build-release.sh --without-zip sign
          for arch in arm64 armv7; do
            tools/sign-release-arm.sh "$INPUT_VERSION" "$arch"
            # Their manifests and signatures sit next to the amd64 ones.
            mv release-"$arch"/SHA256SUMS-* release/
          done

      - name: Upload signed artifact
        uses: actions/upload-artifact@v7
        with:
          name: c-lightning-${{ inputs.version }}
          overwrite: true
          path: release/

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: c-lightning-${{ inputs.version }}-arm64
          overwrite: true
          path: release-arm64/

      - name: Upload armv7 artifact
        uses: actions/upload-artifact@v7
        with:
          name: c-lightning-${{ inputs.version }}-armv7
          overwrite: true
          path: release-armv7/

      - name: Determine release data
        id: release_data
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          CHANGELOG_VERSION=${VERSION#v}
          CHANGELOG_TITLE=$(grep "## \[${CHANGELOG_VERSION}\]" CHANGELOG.md)
          RELEASE_TITLE=$(echo $CHANGELOG_TITLE | cut -d'"' -f2)
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Prepare release draft
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ inputs.version }} ${{ steps.release_data.outputs.release_title }}"
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: contains(inputs.version, "-rc")
          files: |
            release/*
            release-arm64/*
            release-armv7/*
          fail_on_unmatched_files: true
